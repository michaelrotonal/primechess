<!DOCTYPE html>
<html>
<head>
  <title>P R I M E C H E S S</title>
  <meta charset="UTF-8">
  <style>
    body {
      background: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size:  1.0rem; 
      line-height: 1.6;
      font-weight: 100;
      font-family: Helvetica, Arial, sans-serif;
      color: #DDD;
    }

    h1 {
      font-size: 3.0rem;
      letter-spacing: 0.6rem;
      margin: 20px;
      line-height: 3.5rem;
    }

    #gameArea {      
      display: flex;
      flex-direction: row;
    }

    .outerPanel {
      border: 2px double #aaa;
      border-radius: 0.5rem;
      margin: 10px;
    }

    #rightPanel {
      margin-left: -10px;
    }

    #boardArea {
      width: 600px;
      height: 600px;
      padding: 10px
    }

    #upperPanel {
      padding: 10px;
      height: 350px;
      width: 225px;
    }

    #lowerPanel {
      padding: 10px;
      height: 350px;
      width: 225px;
    }

    #console {   
      padding: 10px;
      width: 600px;
      height: 100px;   
    }
  </style>

  <script type="module" src="./js/primechess.js"></script> 
</head>
<body>
<H1>PRIMECHESS</H1>
<dialog id="settingsDialog">
  <div>
    <table>
      <tr>
        <td> AI Player </td>
        <td>
          <input type="checkbox" id="computerPlays">
        </td>
      </tr>
      <tr>
        <td> Chaos Mode </td><td><input type="checkbox" id="chaosMode"></td>
    </table>
    <button id="unsettingsButton">Save</button>
  </div>
</dialog>
<div id="gameArea">
  <div class="outerOuterPanel"  id="leftPanel">
    <div class="outerPanel" id="boardArea">
      <canvas id="gameBoard" width="600" height="600"></canvas></div>
    <div class="outerPanel" id="console">
      <p id="consoleText">You sunk my battleship!</p>
    </div>
  </div>
  <div class="outerOuterPanel"  id="rightPanel">
    <div class="outerPanel" id="upperPanel"><p id="upperPanel">A perfectly ordinary 2.</p> </div>
    <div class="outerPanel" id="lowerPanel"><p>A board square like any other.</p></div>
  </div>
</div>
<div id="settingsButtons">
  <button id="settingsButton">Settings</button>
</div>
</body>
</html>
